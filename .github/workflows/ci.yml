name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -e ".[dev]" supabase>=2.0 pytest-cov

      - name: ruff check
        run: ruff check .

  test:
    name: Testes
    runs-on: ubuntu-latest
    needs: lint
    env:
      SUPABASE_URL: ""
      SUPABASE_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -e ".[dev]" supabase>=2.0 pytest-cov

      - name: pytest com cobertura
        run: pytest --tb=short -q --cov=src/bifinance --cov-report=term-missing

      - name: Upload cobertura para o resumo do CI
        if: always()
        run: |
          echo "## Cobertura de Testes" >> $GITHUB_STEP_SUMMARY
          pytest --tb=no -q --cov=src/bifinance --cov-report=term-missing 2>&1 | tail -20 >> $GITHUB_STEP_SUMMARY || true
