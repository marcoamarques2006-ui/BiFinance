name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  ci:
    name: Lint & Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências de desenvolvimento
        run: pip install -e ".[dev]" supabase>=2.0

      - name: Lint — ruff
        run: ruff check .

      - name: Testes — pytest
        run: pytest --tb=short -q
